name: Deploy Production

# Manual only, by design — production isn't live yet (no DNS cutover), and even
# once it is, prod releases should be a deliberate action, not an automatic
# side effect of a push. Trigger via Actions → "Deploy Production" → Run
# workflow, choosing the ref (branch/tag) to deploy. The "production"
# environment below additionally requires a manual reviewer approval before
# the deploy job runs, on top of this manual trigger.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC
  contents: read
  deployments: write # required so the "environment: production" job creates a
    # real Deployment record — without this, the OIDC token's `sub` claim
    # falls back to a repo/branch-only format instead of the
    # environment-scoped one our IAM trust policy actually checks for.

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: 485141928074.dkr.ecr.ap-south-1.amazonaws.com/rajyarank-api-production
  ECR_REPOSITORY_WORKER: 485141928074.dkr.ecr.ap-south-1.amazonaws.com/rajyarank-worker-production
  ECS_CLUSTER: rajyarank-production
  ECS_SERVICE: rajyarank-production-api
  ECS_SERVICE_WORKER: rajyarank-production-worker
  TASK_FAMILY: rajyarank-production-api
  TASK_FAMILY_WORKER: rajyarank-production-worker

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rajyarank/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    name: Build, migrate, deploy
    needs: [quality]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Assume the production deploy role (OIDC — no stored AWS keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::485141928074:role/rajyarank-github-production-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the API image
        id: build
        env:
          IMAGE_TAG: production-${{ github.sha }}
        run: |
          docker build -f infra/docker/Dockerfile.api -t "$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REPOSITORY:production-latest" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:production-latest"
          echo "image=$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push the Worker image
        id: build-worker
        env:
          IMAGE_TAG: production-${{ github.sha }}
        run: |
          docker build -f infra/docker/Dockerfile.worker -t "$ECR_REPOSITORY_WORKER:$IMAGE_TAG" -t "$ECR_REPOSITORY_WORKER:production-latest" .
          docker push "$ECR_REPOSITORY_WORKER:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY_WORKER:production-latest"
          echo "image=$ECR_REPOSITORY_WORKER:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Register new task definition revision
        id: register-task-def
        run: |
          CURRENT=$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query 'taskDefinition' --output json)
          NEW=$(echo "$CURRENT" | python3 -c "
          import json, sys
          td = json.load(sys.stdin)
          td['containerDefinitions'][0]['image'] = '${{ steps.build.outputs.image }}'
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          print(json.dumps(td))
          ")
          echo "$NEW" > new-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-task-def.json > register-output.json
          echo "revision=$(python3 -c "import json; print(json.load(open('register-output.json'))['taskDefinition']['revision'])")" >> "$GITHUB_OUTPUT"

      - name: Register new worker task definition revision
        id: register-worker-task-def
        run: |
          CURRENT=$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY_WORKER" --query 'taskDefinition' --output json)
          NEW=$(echo "$CURRENT" | python3 -c "
          import json, sys
          td = json.load(sys.stdin)
          td['containerDefinitions'][0]['image'] = '${{ steps.build-worker.outputs.image }}'
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          print(json.dumps(td))
          ")
          echo "$NEW" > new-worker-task-def.json
          aws ecs register-task-definition --cli-input-json file://new-worker-task-def.json > register-worker-output.json
          echo "revision=$(python3 -c "import json; print(json.load(open('register-worker-output.json'))['taskDefinition']['revision'])")" >> "$GITHUB_OUTPUT"

      - name: Apply database migrations (one-off task, same image)
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_FAMILY:${{ steps.register-task-def.outputs.revision }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-08690545b2df36758,subnet-0fc7d3cb0cdb81126,subnet-009c75d2c0c3a100d],securityGroups=[sg-0f93bc272733e704d],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["sh","migrate.sh"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration task failed with exit code $EXIT_CODE — check CloudWatch Logs (/ecs/rajyarank-production)"
            exit 1
          fi
          echo "Migrations applied successfully."

      - name: Deploy new revision to the running service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_FAMILY:${{ steps.register-task-def.outputs.revision }}" \
            --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Deploy new revision to the worker service
        run: |
          # Tolerant of the service not existing yet (created once out-of-band,
          # same as the api service originally was) — every run after that
          # first creation updates it like any other service.
          if aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE_WORKER" --query 'services[?status!=`INACTIVE`]' --output text | grep -q .; then
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE_WORKER" \
              --task-definition "$TASK_FAMILY_WORKER:${{ steps.register-worker-task-def.outputs.revision }}" \
              --force-new-deployment
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE_WORKER"
          else
            echo "::notice::$ECS_SERVICE_WORKER does not exist yet — skipping update. Create it once via 'aws ecs create-service' pointing at $TASK_FAMILY_WORKER:${{ steps.register-worker-task-def.outputs.revision }}."
          fi

      - name: Health check
        run: |
          curl -fsS "${{ vars.PRODUCTION_API_URL || 'http://rajyarank-production-alb-362267456.ap-south-1.elb.amazonaws.com' }}/healthz"
