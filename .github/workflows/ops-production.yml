name: Production Ops Task

# Manual, one-off operational tasks against the Production database that need
# the full workspace (ts-node, workspace packages) rather than the stripped
# production image. Builds the API Dockerfile's builder stage (not the slim
# runner) and runs one of two fixed operations as a one-off Fargate task, in
# the same public subnet + app security group the migrate step already
# uses. Deliberately NOT a free-form command input — this task's execution
# role can read Production's secrets, so the set of things it can run is
# fixed and reviewed here rather than caller-supplied.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Which fixed operation to run'
        required: true
        type: choice
        options:
          - seed-reference-data
          - bootstrap-super-admin
          - fix-super-admin-placeholder-email
          - remove-default-exams

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: 485141928074.dkr.ecr.ap-south-1.amazonaws.com/rajyarank-api-production
  ECS_CLUSTER: rajyarank-production

jobs:
  ops:
    name: Build ops image and run task
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Assume the production deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::485141928074:role/rajyarank-github-production-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the builder-stage (full workspace) image
        run: |
          docker build -f infra/docker/Dockerfile.api --target builder -t "$ECR_REPOSITORY:ops-latest" .
          docker push "$ECR_REPOSITORY:ops-latest"

      - name: Resolve the fixed command for the chosen operation
        id: op
        run: |
          case "${{ inputs.operation }}" in
            seed-reference-data)
              echo 'command=["sh","-c","cd /app && pnpm --filter @rajyarank/api prisma db seed"]' >> "$GITHUB_OUTPUT"
              ;;
            bootstrap-super-admin)
              echo 'command=["node","apps/api/scripts/bootstrap-super-admin.js"]' >> "$GITHUB_OUTPUT"
              ;;
            fix-super-admin-placeholder-email)
              echo 'command=["node","apps/api/scripts/fix-super-admin-placeholder-email.js"]' >> "$GITHUB_OUTPUT"
              ;;
            remove-default-exams)
              echo 'command=["node","apps/api/scripts/remove-default-exams.js"]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown operation ${{ inputs.operation }}"
              exit 1
              ;;
          esac

      - name: Register ops task definition
        run: |
          cat > ops-task-def.json <<EOF
          {
            "family": "rajyarank-production-ops",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "1024",
            "memory": "2048",
            "executionRoleArn": "arn:aws:iam::485141928074:role/rajyarank-production-ecs-execution-role",
            "taskRoleArn": "arn:aws:iam::485141928074:role/rajyarank-production-task-role",
            "containerDefinitions": [{
              "name": "ops",
              "image": "$ECR_REPOSITORY:ops-latest",
              "workingDirectory": "/app",
              "essential": true,
              "command": ${{ steps.op.outputs.command }},
              "environment": [
                {"name": "NODE_ENV", "value": "production"},
                {"name": "APP_ENV", "value": "production"},
                {"name": "BOOTSTRAP_ADMIN_NAME", "value": "${{ vars.BOOTSTRAP_ADMIN_NAME }}"}
              ],
              "secrets": [
                {"name": "DATABASE_URL", "valueFrom": "arn:aws:secretsmanager:ap-south-1:485141928074:secret:rajyarank/production/database-url-NxbCHf"},
                {"name": "FIELD_ENCRYPTION_KEY", "valueFrom": "arn:aws:secretsmanager:ap-south-1:485141928074:secret:rajyarank/production/field-encryption-key-mLcjRL"},
                {"name": "BOOTSTRAP_ADMIN_EMAIL", "valueFrom": "arn:aws:secretsmanager:ap-south-1:485141928074:secret:rajyarank/production/bootstrap-admin-email"},
                {"name": "BOOTSTRAP_ADMIN_PASSWORD", "valueFrom": "arn:aws:secretsmanager:ap-south-1:485141928074:secret:rajyarank/production/bootstrap-admin-password"}
              ],
              "logConfiguration": {
                "logDriver": "awslogs",
                "options": {
                  "awslogs-group": "/ecs/rajyarank-production",
                  "awslogs-region": "ap-south-1",
                  "awslogs-stream-prefix": "ops"
                }
              }
            }]
          }
          EOF
          aws ecs register-task-definition --cli-input-json file://ops-task-def.json --query 'taskDefinition.revision' --output text

      - name: Run the ops task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition rajyarank-production-ops \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-08690545b2df36758,subnet-0fc7d3cb0cdb81126,subnet-009c75d2c0c3a100d],securityGroups=[sg-0f93bc272733e704d],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Ops task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Ops task ($OPERATION) failed with exit code $EXIT_CODE — check CloudWatch Logs (/ecs/rajyarank-production, stream prefix ops)"
            exit 1
          fi
        env:
          OPERATION: ${{ inputs.operation }}
